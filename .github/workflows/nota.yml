# El juez de la nota del 999 (15-oct-2026, Manuel: «mete Ollama para que pueda decidir lo que sea necesario»).
# Ollama con un modelo abierto, en la máquina de GitHub: gratis (repositorio público, sin claves de pago ni servicios externos).
# Pone la nota (0-10) a cada web publicada que la espera; la nube aplica la regla de Manuel: con 8,3 o más la carpeta pasa a por enviar.
name: nota-999
on:
  repository_dispatch:
    types: [nota]
  schedule:
    - cron: '17,47 * * * *'  # cada media hora
  workflow_dispatch: {}
concurrency:
  group: nota-999
  cancel-in-progress: false
jobs:
  nota:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELO: qwen2.5:3b-instruct
      OLLAMA_MODELS: ${{ github.workspace }}/.modelos
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nota
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Modelo guardado (caché de GitHub, para no bajarlo cada vez)
        uses: actions/cache@v4
        with:
          path: .modelos
          key: ollama-qwen2.5-3b-instruct-v1
      - name: Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true   # (el servicio del instalador no usa la carpeta de la caché)
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$MODELO"
      - run: node nota/notar-en-espera.mjs
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
          MAX_MIN: 50
