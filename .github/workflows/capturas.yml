# El 999 en GitHub (19-oct-2026): mira y captura las webs cuando se acaban las horas de navegador de Cloudflare incluidas en el plan (y siempre, si
# el ajuste del núcleo «999-mirar-en» es «github»). Manuel, 11-oct: «configura esa segunda opción para cuando el límite de cloudflare gratis llegue.
# no se puede pasar»; 19-oct: «no quiero pagar mas y lo de cloudflare se acaba». Repositorio público: GitHub no cuenta minutos.
# El núcleo (negocios-nucleo) decide qué se mira y da el código que mide; aquí no hay datos, ni ese código, ni secretos (SECRETO_999 en Secrets).
# La despierta el núcleo cuando hay una web que mirar (con su llave GITHUB_999) y, si no, cada 15 min pregunta si hay algo (si no, se acaba
# en segundos sin instalar nada). Si al acabar quedan webs, pide la vuelta siguiente. Sustituye al capturas-999 de la nube vieja (borrada el 18-oct).
name: capturas-999
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # (sólo para pedir la vuelta siguiente cuando quedan webs)
concurrency:
  group: capturas-999
  cancel-in-progress: false
jobs:
  mirar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            capturas
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirar y capturar lo que el núcleo tenga esperando
        id: mirar
        run: node capturas/mirar-en-espera.mjs
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
          MINUTOS: '25'
      - name: 'La vuelta siguiente, si quedan webs (si no, la despierta el núcleo o la hora programada)'
        if: steps.mirar.outputs.seguir == 'true'
        run: gh workflow run capturas.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
