# El 777 (fase 5, 19-oct-2026): búsqueda de negocios por localidad con los programas del 4-oct (reglas 2026-10-19, toda España), en GitHub.
# El núcleo (negocios-nucleo, Cloudflare) da cada localidad y el código, y recibe el resultado; es el único que escribe en Drive. Repositorio
# público: GitHub no cuenta minutos. Aquí no hay datos, ni código del 777, ni secretos (el secreto está en los Secrets del repositorio).
# Cómo arranca: siempre hay una vuelta viva que espera (Manuel, 19-oct: «sería mejor hacerlo en un repositorio ilimitado»). preflight-777.mjs
# pregunta al núcleo cada 2 minutos, hasta 60, si el 777 está encendido y tiene cola: al encenderlo en el panel empieza en menos de 2 minutos.
# Esperando no instala nada. Al acabar, cada vuelta pide la siguiente ella misma (con el permiso propio del flujo): nunca se queda sin nadie.
# La vuelta programada sólo vuelve a arrancar la cadena si se cortara (medido el 19-oct: en este repositorio llega cada 2–6 h). El núcleo no
# necesita permiso de GitHub (medido: sólo tiene SECRETO_999 y SECRETO_WA). A mano: «Run workflow», con «sola» para una localidad de verdad
# con el 777 apagado (esa vuelta no pide otra). Para pararlo del todo: «Disable workflow» en GitHub.
# Nunca dos vueltas a la vez (una contra Google, como el 4-oct).
name: buscar-777
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      sola:
        description: 'Una sola localidad de verdad (escribe en Drive) con el 777 apagado: «046 - Humilladero (Málaga).txt» o «Humilladero (Málaga)»'
        default: ''
  repository_dispatch:
    types: [buscar-777]
permissions:
  contents: read
  actions: write   # (para pedir la vuelta siguiente cuando queda cola)
concurrency:
  group: buscar-777
  cancel-in-progress: false
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TRABAJO: ${{ github.workspace }}/trabajo-777
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            buscar
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ¿Hay algo que buscar?
        id: permiso
        run: node buscar/preflight-777.mjs
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
          SOLA: ${{ inputs.sola }}
          ESPERA_MIN: 60
      - name: Overture de España (una caché por versión)
        id: overture
        if: steps.permiso.outputs.activo == 'true'
        uses: actions/cache/restore@v4
        with:
          path: trabajo-777/proceso/overture
          key: buscar-777-overture-${{ steps.permiso.outputs.overture }}
      - name: Lo ya consultado (no repetir búsquedas)
        if: steps.permiso.outputs.activo == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            trabajo-777/listas
            trabajo-777/proceso/web_cache.json
          key: buscar-777-consultado-${{ github.run_id }}
          restore-keys: buscar-777-consultado-
      - name: Buscar
        id: buscar
        if: steps.permiso.outputs.activo == 'true'
        run: node buscar/buscar-en-espera.mjs
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
          SOLA: ${{ inputs.sola }}
          MAX_MIN: 250
          IDLE_MIN: 5
      - name: Guardar Overture
        if: always() && steps.permiso.outputs.activo == 'true' && steps.overture.outputs.cache-hit != 'true' && hashFiles('trabajo-777/proceso/overture/webs-telefonos.json') != ''
        uses: actions/cache/save@v4
        with:
          path: trabajo-777/proceso/overture
          key: buscar-777-overture-${{ steps.permiso.outputs.overture }}
      - name: Guardar lo consultado
        if: always() && steps.permiso.outputs.activo == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            trabajo-777/listas
            trabajo-777/proceso/web_cache.json
          key: buscar-777-consultado-${{ github.run_id }}-${{ github.run_attempt }}
      - name: La vuelta siguiente (siempre, salvo «sola»: la cadena no se corta)
        if: always() && inputs.sola == ''
        run: gh workflow run buscar-777.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
