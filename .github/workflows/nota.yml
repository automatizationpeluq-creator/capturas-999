# Revisión textual parcial del 999 con Ollama en GitHub Actions.
# No sustituye al criterio maestro ni aprueba automáticamente una web.
name: nota-999
on:
  repository_dispatch:
    types: [nota]
  schedule:
    - cron: '17,47 * * * *'  # cada media hora
  workflow_dispatch: {}
concurrency:
  group: nota-999
  cancel-in-progress: false
jobs:
  nota:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODELO: qwen2.5:3b-instruct
      OLLAMA_MODELS: ${{ github.workspace }}/.modelos
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            nota
            control
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del contrato
        run: node --test nota/notar-en-espera.test.mjs
      - name: Comprobar pausa y trabajo antes de instalar
        id: permiso
        run: node control/preflight.mjs nota
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
      - name: Comprobar trabajo pendiente
        if: steps.permiso.outputs.activo == 'true'
        id: pendientes
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r = await fetch('https://negocios.automtizationninameu.es/999/nota/pendientes', {
            headers: { authorization: 'Bearer ' + process.env.SECRETO_999 },
            signal: AbortSignal.timeout(120000)
          });
          if (!r.ok) throw new Error('No se pueden leer pendientes: HTTP ' + r.status);
          const d = await r.json();
          if (!Number.isInteger(d.pendientes) || d.pendientes < 0) throw new Error('Respuesta de pendientes inválida');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'cantidad=' + d.pendientes + '\n');
          console.log('Revisiones textuales pendientes:', d.pendientes);
          JS
      - name: Modelo guardado (caché de GitHub, para no bajarlo cada vez)
        if: steps.permiso.outputs.activo == 'true' && steps.pendientes.outputs.cantidad != '0'
        uses: actions/cache@v4
        with:
          path: .modelos
          key: ollama-qwen2.5-3b-instruct-v1
      - name: Ollama
        if: steps.permiso.outputs.activo == 'true' && steps.pendientes.outputs.cantidad != '0'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true   # (el servicio del instalador no usa la carpeta de la caché)
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$MODELO"
      - run: node nota/notar-en-espera.mjs
        if: steps.permiso.outputs.activo == 'true' && steps.pendientes.outputs.cantidad != '0'
        env:
          SECRETO_999: ${{ secrets.SECRETO_999 }}
          MAX_MIN: 50
